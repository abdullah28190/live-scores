workflows:
  android-workflow:
    name: Build Android APK
    environment:
      flutter: stable
    scripts:
      - name: Generate Android project
        script: |
          cd LiveScoresFlutter
          flutter create .
      - name: Build APK
        script: |
          cd LiveScoresFlutter
          flutter build apk --release
    artifacts:
      - LiveScoresFlutter/build/app/outputs/flutter-apk/app-release.apk
